  <line x1="89" y1="39" x2="81" y2="35" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="48" x2="72" y2="44" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="71" y1="57" x2="63" y2="53" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="66" x2="54" y2="62" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
