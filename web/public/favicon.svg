  <!-- Top-left to bottom-right lace line (right rail) -->
  <path d="M 36 20 L 108 100" fill="none" stroke="#c62828" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Cross-stitches between the rails -->
  <line x1="30" y1="30" x2="38" y2="26" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="39" y1="39" x2="47" y2="35" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
