<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Baseball -->
  <circle cx="64" cy="64" r="60" fill="#f5f0e8" stroke="#bbb5a8" stroke-width="3"/>

  <!-- Stitching seam lines forming an X — bold enough for favicon -->
  <!-- Top-left to bottom-right seam -->
  <path d="M 30 26 C 50 46, 46 82, 26 102"
        fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
  <path d="M 38 22 C 56 42, 52 78, 34 98"
        fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
  <!-- Cross-stitches -->
  <line x1="31" y1="34" x2="39" y2="30" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="46" x2="44" y2="42" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="58" x2="46" y2="54" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="70" x2="46" y2="66" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="35" y1="82" x2="43" y2="78" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="93" x2="38" y2="89" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>

  <!-- Top-right to bottom-left seam -->
  <path d="M 98 26 C 78 46, 82 82, 102 102"
        fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
  <path d="M 90 22 C 72 42, 76 78, 94 98"
        fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
  <!-- Cross-stitches -->
  <line x1="97" y1="34" x2="89" y2="30" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="46" x2="84" y2="42" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="58" x2="82" y2="54" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="70" x2="82" y2="66" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="93" y1="82" x2="85" y2="78" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="98" y1="93" x2="90" y2="89" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
</svg>
