  <line x1="66" y1="66" x2="74" y2="62" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="75" x2="83" y2="71" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="84" y1="84" x2="92" y2="80" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
  <line x1="93" y1="93" x2="101" y2="89" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>

